name: Sync Vevntas release

on:
  push:
    paths:
      - '.github/workflows/sync-vevntas-release.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and extract release
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode sync_payload.b64 > /tmp/vevntas-sync.tar.gz
          echo "0cc0e6b1ccc6e359a54aa96c69dcb9e54d6476378fc3428eccaddefdf67847ac  /tmp/vevntas-sync.tar.gz" | sha256sum --check -
          rm -rf vevntas
          tar -xzf /tmp/vevntas-sync.tar.gz
          test -f vevntas/package.json
          test -f vevntas/components/VevntasApp.tsx
          test -f vevntas/public/Modelo_Importacao_Produtos_Vevntas.xlsx
          rm -f sync_payload.b64

      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: optimize inventory purchases barcode and accounting"
          git push origin HEAD:main
